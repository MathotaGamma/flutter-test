name: Build Release APK (Unsigned/Test)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: コードの取得
        uses: actions/checkout@v4

      - name: Java 17のセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutterのセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: パッケージ取得
        run: flutter pub get

      # ReleaseモードでAPKをビルドコマンドを実行
      - name: Release APKのビルド
        run: flutter build apk --release

      # ビルドされたRelease用APKをArtifactsにアップロード
      - name: Artifactsへ保存
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
