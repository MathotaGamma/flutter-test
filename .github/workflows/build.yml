name: Build and Upload APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Javaのセットアップ
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Flutterのセットアップ
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # android/ フォルダがなければその場で自動生成するステップ
      - name: Create scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      # 4. 依存関係のインストール
      - name: Install dependencies
        run: flutter pub get

      # 5. Release APKのビルド
      - name: Build release APK
        run: flutter build apk --release

      # 6. Artifacts にアップロードしてダウンロード可能にする
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
